<section class="stage">
  <mat-button-toggle-group
    class="stage-tabs"
    aria-label="Preview type"
    hideSingleSelectionIndicator
    [value]="ui.tab()"
    (change)="ui.tab.set($event.value)"
  >
    <mat-button-toggle value="form">3D FORM</mat-button-toggle>
    <mat-button-toggle value="template">
      FLAT TEMPLATE
    </mat-button-toggle>
  </mat-button-toggle-group>
  <div class="stage-body">
    @if (design.shape(); as shape) {
      @if (ui.tab() === 'form') {
        <slab-preview
          [meshData]="shape.generateMesh()"
          [wallThickness]="shape.parameters['wallThickness']"
          [thicknessLabel]="design.thicknessLabel()"
          [closedTop]="design.hasClosedTop()"
        />
      } @else {
        <slab-template-preview [template]="shape.generateTemplate()" />
      }
    }
    <div class="view-help legacy-hidden">
      <mat-icon>mouse</mat-icon> Drag to rotate · Scroll to zoom · Shift-drag to pan
    </div>
  </div>
  <footer class="export-bar">
    <div>
      <mat-icon>print</mat-icon>
      <span><b>Ready to make?</b><small>Templates are sized with shrinkage compensation.</small></span>
    </div>
    <div class="export-actions">
      <button
        type="button"
        mat-stroked-button
        [disabled]="design.issues().length > 0"
        (click)="design.export('svg')"
      >
        SVG
      </button>
      <button
        type="button"
        mat-stroked-button
        [disabled]="design.issues().length > 0"
        (click)="design.export('png')"
      >
        PNG
      </button>
      <button
        type="button"
        mat-stroked-button
        aria-label="Borderless PDF"
        [disabled]="design.issues().length > 0"
        (click)="design.export('pdf-borderless')"
      >
        <span class="borderless-label">Borderless&nbsp;</span
        ><span class="borderless-short">Full&nbsp;</span>PDF
      </button>
      <button
        type="button"
        mat-flat-button
        class="primary"
        aria-label="Download PDF"
        [disabled]="design.issues().length > 0"
        (click)="design.export('pdf')"
      >
        <span class="download-label">Download&nbsp;</span>PDF
      </button>
    </div>
    <button
      type="button"
      mat-fab
      class="mobile-export"
      aria-label="Export template"
      [disabled]="design.issues().length > 0"
      [matMenuTriggerFor]="exportMenu"
    >
      <mat-icon>download</mat-icon>
    </button>
    <mat-menu #exportMenu="matMenu" xPosition="before" yPosition="above">
      <button type="button" mat-menu-item (click)="design.export('svg')"><mat-icon>code</mat-icon>SVG</button>
      <button type="button" mat-menu-item (click)="design.export('png')"><mat-icon>image</mat-icon>PNG</button>
      <button type="button" mat-menu-item (click)="design.export('pdf-borderless')">
        <mat-icon>fit_screen</mat-icon>Borderless PDF
      </button>
      <button type="button" mat-menu-item (click)="design.export('pdf')">
        <mat-icon>picture_as_pdf</mat-icon>Download PDF
      </button>
    </mat-menu>
  </footer>
</section>
