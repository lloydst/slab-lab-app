[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slablab"
version = "0.1.0"
description = "Slab Lab App prototype"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "uvicorn>=0.30,<1.0",
    "pillow>=10.0,<12.0",
    "google-genai>=1.0,<2.0",
]

[tool.setuptools]
packages = ["slablab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
